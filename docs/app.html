<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReDash</title>
<script>
// Rutas RELATIVAS: la misma pagina sirve desde la dashcam (raiz) y desde la web publica
// (junto al html). Detectar el origen por puerto se rompia con adb forward o tras un proxy.
(function(){
  var l=document.createElement("link");
  l.rel="stylesheet";l.href="leaflet/leaflet.css";document.head.appendChild(l);
  var f=document.createElement("style");
  f.textContent="@font-face{font-family:'Plus Jakarta Sans';src:url('plus_jakarta.ttf') format('truetype');font-weight:400 800;font-display:swap}";
  document.head.appendChild(f);
})();
</script>
<style>
  /* Mismos tokens que Ds.kt: la web debe sentirse la misma app. */
  :root{--bg:#191B24;--surface:#232632;--hi:#2A2D3A;--card:#20222C;
    --tx:#FFFFFF;--tx2:#A7AABC;--mut:#787C92;--on-pri:#181030;
    --pri:#A78BFA;--prih:#C4B5FD;--pri-tint:rgba(167,139,250,.10);--pri-tint2:rgba(167,139,250,.20);
    --warm:#F79E8C;--warmh:#FFB9A8;--warm-tint:rgba(247,158,140,.10);--warm-edge:rgba(247,158,140,.31);
    --ok:#5EC9A0;--ok-edge:rgba(94,201,160,.35);--line:rgba(255,255,255,.12);--edge:rgba(255,255,255,.18)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--tx);min-height:100vh;
    font:15px/1.5 "Plus Jakarta Sans",system-ui,Segoe UI,Roboto,sans-serif;letter-spacing:-.01em}
  .wrap{max-width:1060px;margin:0 auto;padding:16px 16px 40px}
  /* las pantallas de una columna se centran para no dejar hueco a la derecha */
  #root > [style*="max-width"]{margin-left:auto;margin-right:auto}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .ic{width:22px;height:22px;flex:none;display:block}
  .icobtn .ic{width:21px;height:21px}
  .role .ico .ic{width:26px;height:26px}
  .sat .circle .ic{width:22px;height:22px}
  .trigger .circle .ic{width:32px;height:32px}
  .ovbtn .ic{width:17px;height:17px}
  .navrow .ico .ic{width:21px;height:21px}
  .chev{width:16px;height:16px;color:var(--mut)}
  .glass{background:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.03));
    border:1px solid var(--line);border-radius:16px}
  .row{display:flex;align-items:center;gap:10px}
  .spacer{flex:1}
  .hidden{display:none!important}
  /* appbar */
  .bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .bar h1{font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .icobtn{width:42px;height:42px;border:none;background:none;color:var(--tx);cursor:pointer;
    border-radius:12px;font-size:20px;display:flex;align-items:center;justify-content:center}
  .icobtn:hover{background:rgba(255,255,255,.07)}
  .pill{font:700 11px/1 ui-monospace,monospace;padding:6px 10px;border-radius:99px;
    border:1px solid var(--line);color:var(--tx2);white-space:nowrap}
  .pill.rec{color:var(--warmh);border-color:var(--warm-edge);background:var(--warm-tint)}
  .pill.ok{color:var(--ok);border-color:var(--ok-edge)}
  .pill.pri{color:var(--tx);background:var(--pri-tint2);border-color:var(--line)}
  /* botones */
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:14px;
    font:700 14px inherit;padding:13px 18px;cursor:pointer;width:100%;text-decoration:none;
    transition:transform .06s}
  .btn:active{transform:scale(.98)}
  .btn.pri{background:linear-gradient(135deg,#C4B5FD,#A78BFA);color:var(--on-pri)}
  .btn.warm{background:var(--warm-tint);border:1px solid var(--warm-edge);color:var(--warmh)}
  .btn.ghost{background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--tx2)}
  /* chooser (espejo del de la app) */
  .chooser{max-width:520px;margin:6vh auto;text-align:center;padding:0 16px}
  .logo{width:96px;height:96px;border-radius:24px;border:2px solid var(--pri);margin:0 auto 18px;
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  .chooser h1{font-size:30px;font-weight:800;margin-bottom:6px}
  .chooser .tag{color:var(--tx2);margin-bottom:26px}
  .kicker{font:700 10px inherit;letter-spacing:.14em;color:var(--mut);text-align:left;margin-bottom:10px}
  .role{display:flex;align-items:center;gap:14px;padding:18px;margin-bottom:12px;cursor:pointer;text-align:left}
  .role .ico{width:52px;height:52px;border-radius:15px;background:var(--pri-tint);color:var(--pri);
    display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
  .role b{display:block;font-size:17px;font-weight:700}
  .role span{color:var(--mut);font-size:13px}
  .foot{color:var(--mut);font-size:13px;margin-top:22px}
  /* drawer */
  #drawer{position:fixed;inset:0;background:var(--bg);z-index:40;overflow:auto;padding:16px}
  .navrow{display:flex;align-items:center;gap:14px;padding:16px 14px;cursor:pointer;border-radius:12px}
  .navrow:hover{background:rgba(255,255,255,.05)}
  .navrow.on{background:var(--pri-tint2);border-left:3px solid var(--pri)}
  .navrow .ico{color:var(--pri);font-size:20px;width:24px;text-align:center}
  .switch{margin-top:20px;border:1px solid var(--pri);color:var(--prih);background:var(--pri-tint)}
  /* layout de contenido */
  .grid2{display:grid;grid-template-columns:2fr 1fr;gap:14px}
  @media(max-width:860px){.grid2{grid-template-columns:1fr}}
  .viewport{position:relative;border-radius:14px;overflow:hidden;background:var(--hi)}
  video,.viewport img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--hi)}
  .hud{position:absolute;font:700 10px ui-monospace,monospace;background:rgba(12,10,22,.78);
    padding:4px 8px;border-radius:8px}
  .hud.tl{top:10px;left:10px;color:var(--warmh)} .hud.tr{top:10px;right:10px;color:var(--tx2)}
  .hud.bl{bottom:10px;left:10px;color:var(--prih)}
  .ovbtns{position:absolute;bottom:10px;right:10px;display:flex;gap:8px}
  .ovbtn{width:38px;height:38px;border-radius:50%;background:rgba(12,10,22,.78);border:none;color:#fff;
    cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
  /* chips de modo (idénticos a la app) */
  .modes{display:flex;gap:8px;margin:10px 0}
  .mode{flex:1;display:flex;align-items:center;gap:8px;padding:11px 12px;cursor:pointer;
    background:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.03));
    border:1px solid var(--line);border-radius:14px;user-select:none}
  .mode .nm{font-weight:600;font-size:12.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mode .tag{margin-left:auto;font:700 9px ui-monospace,monospace;border:1px solid var(--line);
    border-radius:6px;padding:3px 6px;color:var(--mut)}
  .mode.on{border-color:var(--warm-edge)}
  .mode.on .tag{color:var(--warm);border-color:var(--warm-edge)}
  .mode.on .nm{color:var(--warmh)}
  /* medidores */
  .gauges{display:flex;gap:8px;margin-bottom:12px}
  .gauge{flex:1;padding:11px 12px;background:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.03));
    border:1px solid var(--line);border-radius:14px;min-width:0}
  .gauge span{display:block;font:700 8.5px inherit;letter-spacing:.12em;color:var(--mut)}
  .gauge b{display:block;font:700 17px ui-monospace,monospace;margin:4px 0 6px}
  .bar-bg{height:4px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
  .bar-fill{height:100%;background:linear-gradient(90deg,#A78BFA,#C4B5FD);width:0}
  /* deck: satélite · disparador · satélite */
  .deck{display:flex;align-items:center;justify-content:center;gap:34px;margin:14px 0}
  .sat{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
  .sat .circle{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.07);
    border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
    font-size:21px;color:var(--prih)}
  .sat small{font:700 10px inherit;color:var(--mut)}
  .sat.warm .circle{background:var(--warm-tint);border-color:var(--warm-edge);color:var(--warm)}
  .sat.warm small{color:var(--warm)}
  .trigger{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
  .trigger .circle{width:78px;height:78px;border-radius:50%;font-size:30px;color:var(--on-pri);
    background:linear-gradient(135deg,#C4B5FD,#A78BFA);display:flex;align-items:center;justify-content:center}
  .trigger.rec .circle{background:var(--warm-tint);border:3px solid var(--warm-edge);color:var(--warmh)}
  .trigger small{font:700 11px inherit;color:var(--tx)}
  /* tabs */
  .tabs{display:flex;border-top:1px solid var(--line);padding-top:10px}
  .tab{flex:1;text-align:center;font:700 12.5px inherit;color:var(--mut);cursor:pointer;padding:4px}
  .tab.on{color:var(--tx)}
  .tab.on::after{content:"";display:block;width:5px;height:5px;border-radius:50%;background:var(--pri);margin:5px auto 0}
  /* grid de cámaras del viewer */
  .cams{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .cam{padding:14px;cursor:pointer;min-height:120px;display:flex;flex-direction:column}
  .cam b{font-size:16px;font-weight:700}
  .cam .st{margin-top:auto;font:700 12px ui-monospace,monospace;color:var(--mut)}
  .cam .sub{font-size:11.5px;color:var(--mut)}
  .cam.rec{border-color:var(--warm-edge)} .cam.rec .st{color:var(--warm)}
  .addcard{border:2px dashed var(--line);border-radius:16px;display:flex;align-items:center;
    justify-content:center;gap:8px;color:var(--mut);cursor:pointer;min-height:120px;font-weight:600}
  /* listas */
  .item{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid rgba(255,255,255,.06);font-size:13.5px}
  .item time{color:var(--mut);font:600 11px ui-monospace,monospace;white-space:nowrap}
  .item a{color:var(--prih);text-decoration:none;margin-left:auto}
  .badge{font:700 9px ui-monospace,monospace;color:var(--warm);border:1px solid var(--warm-edge);
    border-radius:5px;padding:2px 6px}
  /* formularios */
  label{display:block;font:700 9px inherit;letter-spacing:.12em;color:var(--mut);margin-bottom:5px}
  input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.35);
    color:var(--tx);font:600 14px ui-monospace,monospace;margin-bottom:12px}
  .hint{color:var(--mut);font-size:12.5px}
  .err{color:var(--warmh);font-size:13px;min-height:18px}
  .kick{font:700 10px inherit;letter-spacing:.14em;color:var(--mut);margin:20px 0 8px}
  #map{height:420px;border-radius:14px;background:var(--hi)}
  .leaflet-tile{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.65)}
  .leaflet-control-attribution{background:rgba(18,20,29,.8)!important;color:#8b88a0!important}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:10px 2px}
  .chip{white-space:nowrap;font:600 12px inherit;color:var(--tx2);background:rgba(255,255,255,.07);
    border:1px solid var(--line);border-radius:99px;padding:7px 13px;cursor:pointer}
  .chip.on{background:linear-gradient(135deg,#C4B5FD,#A78BFA);color:var(--on-pri);border-color:transparent}
  .dialog{max-width:360px;margin:12vh auto;padding:24px;text-align:center}
  .dialog h2{font-size:19px;font-weight:700;margin-bottom:8px}
  .dlgbtns{display:flex;gap:10px;margin-top:20px}
  /* width:100% de .btn choca dentro de una fila flex y parte el texto letra a letra:
     aqui manda flex:1 y el alto es fijo, como los botones de la app. */
  .dlgbtns .btn{flex:1 1 0;width:auto;height:46px;padding:0 14px;white-space:nowrap}
  .btn.sm{font-size:13.5px;border-radius:12px}
  #flash{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(20,17,34,.95);
    border:1px solid var(--line);color:var(--tx);padding:12px 20px;border-radius:14px;display:none;z-index:70;font-weight:600}
</style></head>

// Iconos: los MISMOS VectorDrawables del APK, convertidos a simbolos SVG. currentColor

function logoEl(){
  var d=el("div","logo");var i=document.createElement("img");
  i.src="logo.png";i.alt="ReDash";i.width=76;i.height=76;
  i.style.borderRadius="18px";d.appendChild(i);return d;
}
function ico(name,size){
  var s=document.createElementNS("http://www.w3.org/2000/svg","svg");
  s.setAttribute("class","ic");s.setAttribute("aria-hidden","true");
  if(size){s.style.width=size+"px";s.style.height=size+"px";}
  var u=document.createElementNS("http://www.w3.org/2000/svg","use");
  u.setAttribute("href","#i-"+name);s.appendChild(u);return s;
}
function icoBtn(name,cls,fn){var b=el("button",cls||"icobtn");b.appendChild(ico(name));if(fn)b.onclick=fn;return b;}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e;}
function mk(html){var d=document.createElement("div");d.innerHTML=html;return d.firstElementChild;}
function flash(msg){var f=document.getElementById("flash");f.textContent=msg;f.style.display="block";
  clearTimeout(f.__t);f.__t=setTimeout(function(){f.style.display="none";},1600);}
function mmss(s){s=Math.max(0,s|0);return String(s/60|0).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
var LS={get:function(k,d){var v=localStorage.getItem(k);return v===null?d:v;},set:function(k,v){localStorage.setItem(k,v);}};

/* ============================ estado ============================ */
var mode=LS.get("rd_mode","");           // "" | sender | viewer
var KEY=LS.get("rd_key","");             // clave de la dashcam que sirve esta página
var hasLocal=false;                      // ¿esta página la sirve una dashcam?
var screen="home", tab="live";
var timers=[];                           // se limpian en cada cambio de pantalla
function clearTimers(){timers.forEach(clearInterval);timers.forEach(clearTimeout);timers=[];}
function every(ms,fn){var id=setInterval(fn,ms);timers.push(id);return id;}

/* ============================ API de la dashcam local ============================ */
function api(path,opts){opts=opts||{};opts.headers=Object.assign({},opts.headers,{Authorization:"Bearer "+KEY});return fetch(path,opts);}
function j(path){return api(path).then(function(r){if(!r.ok)throw 0;return r.json();});}
function post(path){return api(path,{method:"POST"});}

/* ============================ router ============================ */
function render(){
  clearTimers();
  var root=document.getElementById("root");
  root.replaceChildren();
  document.getElementById("drawer").classList.add("hidden");
  if(!mode){drawChooser(root);return;}
  if(mode==="sender")drawSender(root);
  else drawViewer(root);
}
function go(s,arg){screen=s;screenArg=arg;render();}
var screenArg=null;

var stream=null,facing="user",recOn=false,recStart=0,segStart=0,clips=[],events=[],
    motionOn=false,impactOn=false,protectNext=false,mediaRec=null,prevGrid=null,

/* Ajustes (persisten en localStorage). Cada uno se lee al vuelo para que aplique enseguida. */
function setg(k,d){return LS.get("rd_"+k,d);}
function qWidth(){return {sd:640,hd:1280,fhd:1920}[setg("quality","hd")]||1280;}
function audioOn(){return setg("audio","0")==="1";}
function motionThresh(){return {low:11,med:6,high:3}[setg("sens","med")]||6;}
function segMs(){return (parseInt(setg("seg","60"),10)||60)*1000;}
function keepN(){return parseInt(setg("keep","6"),10)||6;}
function videoConstraints(){return {video:{facingMode:facing,width:{ideal:qWidth()}},audio:audioOn()};}
function addEvent(type,msg){events.unshift({t:Date.now(),type:type,msg:msg});if(events.length>60)events.pop();}

  if(mediaRec&&mediaRec.state==="recording"){recOn=false;try{mediaRec.stop();}catch(e){}}
  if(stream){stream.getTracks().forEach(function(x){x.stop();});stream=null;}
  linkDown(true);
}

/* cámara */
async function startCamera(errEl){
  try{
    var list=await Promise.race([navigator.mediaDevices.enumerateDevices(),
      new Promise(function(_,rej){setTimeout(function(){rej({name:"Hang"});},4000);})]);
    if(!list.filter(function(d){return d.kind==="videoinput";}).length){errEl.textContent=t("cam_none");return;}
  }catch(e){if(e&&e.name==="Hang"){errEl.textContent=t("cam_hang");return;}}
  try{stream=await navigator.mediaDevices.getUserMedia(videoConstraints());}
  catch(e){errEl.textContent=t("cam_denied");return;}
  addEvent("system","Camera on");
  render();
}
async function flipCamera(){
  facing=facing==="user"?"environment":"user";
  if(stream)stream.getTracks().forEach(function(x){x.stop();});
  try{
    stream=await navigator.mediaDevices.getUserMedia(videoConstraints());
    if(pc){var s=pc.getSenders().find(function(x){return x.track&&x.track.kind==="video";});
      if(s)s.replaceTrack(stream.getVideoTracks()[0]);}
    render();
  }catch(e){}
}
/* grabación en bucle */
function pickMime(){
  var o=["video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm","video/mp4"];
  for(var i=0;i<o.length;i++)if(window.MediaRecorder&&MediaRecorder.isTypeSupported(o[i]))return o[i];
  return "";
}
function startSeg(){
  if(!stream)return;
  var chunks=[],mime=pickMime();
  mediaRec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);
  mediaRec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data);};
  mediaRec.onstop=function(){
    if(chunks.length)saveClip(new Blob(chunks,{type:mime||"video/webm"}));
    if(recOn)startSeg();
  };
  mediaRec.start();segStart=Date.now();
  setTimeout(function(){if(mediaRec&&mediaRec.state==="recording")mediaRec.stop();},segMs());
}
function toggleRec(){
  recOn=!recOn;
  if(recOn){recStart=Date.now();startSeg();addEvent("recording","Started");}
  else{if(mediaRec&&mediaRec.state==="recording")mediaRec.stop();addEvent("recording","Stopped");}
  render();
}
function saveClip(blob){
  var prot=protectNext;protectNext=false;
  clips.unshift({url:URL.createObjectURL(blob),at:Date.now(),size:blob.size,prot:prot});
  var keep=[];clips.forEach(function(c){
    if(c.prot||keep.length<keepN())keep.push(c);else URL.revokeObjectURL(c.url);
  });
  clips=keep;
}
function renderClips(box){
  if(!clips.length){box.appendChild(el("p","hint",t("no_clips")));return;}
  clips.forEach(function(c){
    var r=el("div","item");
    r.appendChild(el("time",null,new Date(c.at).toLocaleTimeString()));
    r.appendChild(el("span",null,(c.size/1e6).toFixed(1)+" MB"));
    if(c.prot)r.appendChild(el("span","badge",t("prot")));
    var a=el("a",null,t("dl"));a.href=c.url;
    a.setAttribute("download","redash-"+new Date(c.at).toISOString().replace(/[:.]/g,"-")+".webm");
    r.appendChild(a);box.appendChild(r);
  });
}
function renderEvents(box){
  if(!events.length){box.appendChild(el("p","hint",t("no_events")));return;}
  events.forEach(function(e){
    var r=el("div","item");
    r.appendChild(el("time",null,new Date(e.t).toLocaleTimeString()));
    var d=el("div");d.appendChild(el("b",null,e.type));d.appendChild(document.createTextNode(" · "+e.msg));
    r.appendChild(d);box.appendChild(r);
  });
}
/* detección de movimiento por diferencia de cuadros */
var mc=document.createElement("canvas");mc.width=32;mc.height=24;
var mx=mc.getContext("2d",{willReadFrequently:true});
function sampleMotion(){
  var vid=document.querySelector("video");
  if(!stream||!vid||!vid.videoWidth)return;
  mx.drawImage(vid,0,0,32,24);
  var d=mx.getImageData(0,0,32,24).data,grid=new Array(768),score=0;
  for(var i=0,p=0;i<d.length;i+=4,p++)grid[p]=(d[i]*30+d[i+1]*59+d[i+2]*11)/100;
  if(prevGrid){for(var k=0;k<grid.length;k++)score+=Math.abs(grid[k]-prevGrid[k]);score/=grid.length;}
  prevGrid=grid;motionScore=score;
  if(motionOn&&score>motionThresh()&&Date.now()-lastMotionAt>8000){
    lastMotionAt=Date.now();protectNext=true;
    if(!recOn)toggleRec();
    addEvent("motion","Motion detected");flash(t("motion_ev"));
  }
}
function onImpact(e){
  var a=e.accelerationIncludingGravity;if(!a)return;
  var m=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z);
  if(m>28&&Date.now()-lastImpactAt>6000){
    lastImpactAt=Date.now();protectNext=true;
    if(!recOn)toggleRec();
    addEvent("impact","Impact detected");flash(t("impact"));
  }
}

function stealthStatus(){
  if(recOn&&linkState==="live")return t("st_rec_link");
  if(recOn)return t("st_rec");
  if(linkState==="live")return t("st_link");
  return t("st_idle");
}
function stealthPad(prompt,onDone){
  var ov=document.createElement("div");ov.id="stealthpad";
  ov.style.cssText="position:fixed;inset:0;background:#000;z-index:101;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;cursor:default";
  var lbl=el("div",null,prompt);lbl.style.cssText="color:#A7AABC;font-size:14px";
  var dots=el("div");dots.style.cssText="display:flex;gap:12px";var entry="";
  function paintDots(){dots.replaceChildren();for(var i=0;i<4;i++){var x=el("div");x.style.cssText="width:13px;height:13px;border-radius:50%;border:2px solid #A78BFA;background:"+(i<entry.length?"#A78BFA":"transparent");dots.appendChild(x);}}
  paintDots();
  var grid=el("div");grid.style.cssText="display:grid;grid-template-columns:repeat(3,66px);gap:12px";
  ["1","2","3","4","5","6","7","8","9","","0","<"].forEach(function(k){
    var bt=el("button",null,k==="<"?"\u232B":k);
    bt.style.cssText="height:62px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;font:600 20px inherit;cursor:pointer"+(k===""?";visibility:hidden":"");
    bt.onclick=function(){
      if(k==="<")entry=entry.slice(0,-1);else if(entry.length<4)entry+=k;
      paintDots();
      if(entry.length===4){var v=entry;entry="";paintDots();onDone(v,ov,lbl);}
    };
    grid.appendChild(bt);
  });
  ov.appendChild(lbl);ov.appendChild(dots);ov.appendChild(grid);document.body.appendChild(ov);
}
function enterStealth(){
  if(document.getElementById("stealth")||document.getElementById("stealthpad"))return;
  if(!LS.get("rd_pin","")){
    var first="";
    stealthPad(t("pin_set"),function(v,ov,lbl){
      if(!first){first=v;lbl.textContent=t("pin_confirm");}
      else if(v===first){LS.set("rd_pin",v);ov.remove();stealthOverlay();}
      else{first="";lbl.textContent=t("pin_set");}
    });
    return;
  }
  stealthOverlay();
}
function stealthOverlay(){
  var ov=document.createElement("div");ov.id="stealth";
  ov.style.cssText="position:fixed;inset:0;background:#000;z-index:100;display:flex;align-items:center;justify-content:center;cursor:none";
  // En sigilo NO se revela el estado (grabando/enlazado): solo el nombre y como salir.
  var hint=el("div",null,"ReDash \u00b7 "+t("stealth_exit"));
  hint.style.cssText="color:rgba(255,255,255,.28);font-size:12px;text-align:center;transition:opacity 1s";
  ov.appendChild(hint);ov.onclick=askPin;
  document.addEventListener("keydown",stealthKey);document.body.appendChild(ov);
  window.__exitStealth=askPin;   // desktop: reabrir desde la bandeja pide el PIN
  if(window.RD_DESKTOP&&RD_DESKTOP.setStealth)RD_DESKTOP.setStealth(true);
  setTimeout(function(){var e=document.getElementById("stealth");if(e)e.firstChild.style.opacity="0";},4000);
}
function stealthKey(e){if(e.key==="Escape")askPin();}
function askPin(){
  if(document.getElementById("stealthpad"))return;
  stealthPad(t("pin_enter"),function(v,ov,lbl){
    if(v===LS.get("rd_pin","")){ov.remove();exitStealth();}
    else lbl.textContent=t("pin_wrong");
  });
}
function exitStealth(){
  var ov=document.getElementById("stealth");if(ov)ov.remove();
  var p=document.getElementById("stealthpad");if(p)p.remove();
  document.removeEventListener("keydown",stealthKey);
  if(window.RD_DESKTOP&&RD_DESKTOP.setStealth)RD_DESKTOP.setStealth(false);
}

function linkUp(errEl){
  var dev=LS.get("rd_dev",""),tok=LS.get("rd_tok",""),url=LS.get("rd_url",DEFAULT_SIGNAL);
  if(!dev||!tok)return;
  try{ws=new WebSocket(url+"/signal");}catch(e){return;}
  linkState="wait";
  ws.onopen=function(){ws.send(JSON.stringify({type:"hello",role:"sender",deviceId:dev,token:tok}));};
  ws.onmessage=function(ev){
    var m;try{m=JSON.parse(ev.data);}catch(e){return;}
    if(m.type==="hello-ok")iceServers=m.iceServers||[];
    else if(m.type==="offer")onOffer(m.sdp);
    else if(m.type==="ice"&&pc)pc.addIceCandidate({candidate:m.candidate,sdpMid:m.sdpMid,sdpMLineIndex:m.sdpMLineIndex}).catch(function(){});
    else if(m.type==="peer-left"){teardownPc();linkState="wait";}
    else if(m.type==="error"){if(errEl)errEl.textContent=t("link_bad");flash(t("link_bad"));linkDown(true);}
  };
  ws.onclose=function(){if(linkState!=="off"){teardownPc();linkState="wait";
    clearTimeout(retry);retry=setTimeout(function(){if(linkState!=="off")linkUp();},5000);}};
}
async function onOffer(sdp){
  teardownPc();
  if(!stream)return;                          // sin cámara no hay nada que publicar
  pc=new RTCPeerConnection({iceServers:iceServers});
  stream.getTracks().forEach(function(tr){pc.addTrack(tr,stream);});
  pc.onicecandidate=function(e){
    if(e.candidate&&ws&&ws.readyState===1)ws.send(JSON.stringify({type:"ice",
      candidate:e.candidate.candidate,sdpMid:e.candidate.sdpMid,sdpMLineIndex:e.candidate.sdpMLineIndex}));
  };
  pc.onconnectionstatechange=function(){
    if(pc.connectionState==="connected")linkState="live";
    else if(pc.connectionState==="failed"){teardownPc();linkState="wait";}
  };
  await pc.setRemoteDescription({type:"offer",sdp:sdp});
  var a=await pc.createAnswer();await pc.setLocalDescription(a);
  ws.send(JSON.stringify({type:"answer",sdp:a.sdp}));
}
function teardownPc(){if(pc){try{pc.close();}catch(e){}pc=null;}}
function linkDown(silent){
  clearTimeout(retry);teardownPc();
  if(ws){try{ws.close();}catch(e){}ws=null;}
  linkState="off";if(!silent)render();
}

/* --- escaneo de QR: BarcodeDetector nativo, sin librerias --- */
function drawQr(root){
  var bar=appbar(t("add_qr"));
  var back=icoBtn("back",null,function(){stopQr();go("add");});
  bar.replaceChild(back,bar.firstChild);root.appendChild(bar);
  var c=el("div","glass");c.style.padding="14px";c.style.maxWidth="520px";
  var vp=el("div","viewport");
  var v=el("video");v.autoplay=true;v.muted=true;v.playsInline=true;vp.appendChild(v);
  c.appendChild(vp);
  var msg=el("p","hint",t("qr_aim"));msg.style.marginTop="10px";c.appendChild(msg);
  root.appendChild(c);
  // jsQR sobre canvas: BarcodeDetector solo existe en Android/macOS/ChromeOS, en Chrome de
  // Windows no, asi que decodificar por software es lo unico que funciona en todas partes.
  var cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});
  function handle(val){
    if(val.indexOf("redash://pair")!==0){msg.textContent=t("qr_foreign");return false;}
    var u=decodeURIComponent((val.match(/[?&]u=([^&]*)/)||[])[1]||"");
    var k=decodeURIComponent((val.match(/[?&]k=([^&]*)/)||[])[1]||"");
    if(!u||!k){msg.textContent=t("qr_foreign");return false;}
    stopQr();addDashcam(u,k);return true;
  }
  navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}).then(function(st){
    qrStream=st;v.srcObject=st;
    var id=every(300,function(){
      if(!v.videoWidth||typeof jsQR!=="function")return;
      cv.width=v.videoWidth;cv.height=v.videoHeight;
      cx.drawImage(v,0,0,cv.width,cv.height);
      var img=cx.getImageData(0,0,cv.width,cv.height);
      var code=jsQR(img.data,img.width,img.height,{inversionAttempts:"dontInvert"});
      if(code&&code.data){if(handle(code.data))clearInterval(id);}
    });
  }).catch(function(){msg.textContent=t("cam_denied");});
  // Sin camara (o si falla) siempre queda pegar el enlace del QR a mano.
  var man=el("div");man.style.marginTop="14px";
  man.appendChild(el("label",null,t("qr_manual")));
  var im=el("input");im.placeholder="redash://pair?u=...&k=...";man.appendChild(im);
  var mb=el("button","btn ghost",t("add"));
  mb.onclick=function(){if(!handle(im.value.trim()))return;};
  man.appendChild(mb);c.appendChild(man);
}

   servicio responde con CORS y la clave sigue siendo obligatoria en cada peticion. */
function addDashcam(url,key){
  url=url.replace(/\/$/,"");

    var l=cams();l.push({name:url.replace(/^https?:\/\//,""),type:"dash",url:url,key:key});saveCams(l);
    flash(t("added"));go("home");
  }).catch(function(){flash(t("qr_unreachable"));go("add");});
}

    var l=r.clips||[];
    if(!l.length){box.appendChild(el("p","hint",t("no_clips")));return;}
    l.forEach(function(c){
      var url=BASE+"/clips/file/"+encodeURIComponent(c.name)+"?k="+encodeURIComponent(AKEY);
      var r2=el("div","item");
      var n=el("span",null,c.name);r2.appendChild(n);
      if(c["protected"])r2.appendChild(el("span","badge",t("prot")));
      r2.appendChild(el("span",null,(c.bytes/1e6).toFixed(1)+" MB"));
      var a=el("a",null,t("dl"));a.href=url;a.setAttribute("download",c.name);r2.appendChild(a);
      box.appendChild(r2);
    });
  });
}
function loadLocalEvents(box,BASE,AKEY){

/* cámara web remota (WebRTC, rol viewer) */
var vws=null,vpc=null;
function drawWebCam(root,i){
  var cam=cams()[i];if(!cam)return go("home");
  var pill=el("span","pill","…");
  var bar=appbar(cam.name,[pill]);
  var back=icoBtn("back",null,function(){closeWebCam();go("home");});
  bar.replaceChild(back,bar.firstChild);
  root.appendChild(bar);
  var card=el("div","glass");card.style.padding="14px";card.style.maxWidth="760px";
  var vp=el("div","viewport");
  var vid=el("video");vid.autoplay=true;vid.muted=true;vid.playsInline=true;vp.appendChild(vid);
  card.appendChild(vp);
  var info=el("p","hint",t("web_cam")+" · "+cam.device);info.style.marginTop="10px";card.appendChild(info);
  var del=el("button","btn ghost");del.appendChild(ico("close"));del.style.marginTop="12px";del.style.maxWidth="120px";
  del.onclick=function(){var l=cams();l.splice(i,1);saveCams(l);closeWebCam();go("home");};
  card.appendChild(del);
  root.appendChild(card);

  closeWebCam();
  var ice=[];
  vws=new WebSocket((cam.url||DEFAULT_SIGNAL)+"/signal");
  vws.onopen=function(){vws.send(JSON.stringify({type:"hello",role:"viewer",deviceId:cam.device,token:cam.token}));};
  vws.onmessage=async function(ev){
    var m;try{m=JSON.parse(ev.data);}catch(e){return;}
    if(m.type==="hello-ok"){ice=m.iceServers||[];offer();}
    else if(m.type==="peer-joined")offer();
    else if(m.type==="answer"&&vpc)await vpc.setRemoteDescription({type:"answer",sdp:m.sdp});
    else if(m.type==="ice"&&vpc)vpc.addIceCandidate({candidate:m.candidate,sdpMid:m.sdpMid,sdpMLineIndex:m.sdpMLineIndex}).catch(function(){});
    else if(m.type==="error"){pill.textContent=t("link_bad");}
  };
  async function offer(){
    if(vpc)try{vpc.close();}catch(e){}
    vpc=new RTCPeerConnection({iceServers:ice});
    vpc.addTransceiver("video",{direction:"recvonly"});
    vpc.ontrack=function(e){vid.srcObject=e.streams[0];};
    vpc.onicecandidate=function(e){if(e.candidate&&vws.readyState===1)vws.send(JSON.stringify({type:"ice",
      candidate:e.candidate.candidate,sdpMid:e.candidate.sdpMid,sdpMLineIndex:e.candidate.sdpMLineIndex}));};
    vpc.onconnectionstatechange=function(){
      pill.textContent=vpc.connectionState==="connected"?t("live"):vpc.connectionState;
      pill.className="pill"+(vpc.connectionState==="connected"?" ok":"");
    };
    var o=await vpc.createOffer();await vpc.setLocalDescription(o);
    vws.send(JSON.stringify({type:"offer",sdp:o.sdp}));
  }
}
function closeWebCam(){
  if(vpc){try{vpc.close();}catch(e){}vpc=null;}
  if(vws){try{vws.close();}catch(e){}vws=null;}
}

/* ============================ mapa ============================ */
var map=null,liveMk=null,trail=null,tA=null,tB=null,shownTrip=null;
function drawMapScreen(root,remote){
  var bar=appbar(t("tab_map"));
  var back=icoBtn("back",null,function(){go("home");});
  bar.replaceChild(back,bar.firstChild);
  root.appendChild(bar);
  var card=el("div","glass");card.style.padding="14px";
  var m=el("div");m.id="map";card.appendChild(m);
  var chips=el("div","chips");card.appendChild(chips);
  root.appendChild(card);
  map=null;
  setTimeout(function(){
    map=L.map("map",{zoomControl:true,attributionControl:false}).setView([0,0],2);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(map);
    if(remote&&hasLocal){
      every(3000,function(){
        j("/status").then(function(s){if(s.latitude!==undefined)setLive(+s.latitude,+s.longitude);});
      });
      j("/trips").then(function(r){renderTrips(chips,r.trips||[]);});
    }else if(navigator.geolocation){
      navigator.geolocation.watchPosition(function(p){setLive(p.coords.latitude,p.coords.longitude);},function(){},{enableHighAccuracy:true});
      chips.appendChild(el("p","hint",t("no_trips")));
    }
  },60);
}
function setLive(lat,lon){
  if(!map)return;
  if(!liveMk){liveMk=L.circleMarker([lat,lon],{radius:8,color:"#afa9ec",weight:2,fillColor:"#7f77dd",fillOpacity:1}).addTo(map);map.setView([lat,lon],16);}
  else liveMk.setLatLng([lat,lon]);
}
function renderTrips(box,trips){
  box.replaceChildren();
  if(!trips.length){box.appendChild(el("p","hint",t("no_trips")));return;}
  trips.slice(0,12).forEach(function(tr){
    var c=el("span","chip"+(shownTrip===tr.id?" on":""),
      new Date(tr.start).toLocaleString(undefined,{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})+" · "+tr.km.toFixed(1)+" km");
    c.onclick=function(){
      [trail,tA,tB].forEach(function(x){if(x)map.removeLayer(x);});trail=tA=tB=null;
      if(shownTrip===tr.id){shownTrip=null;renderTrips(box,trips);return;}
      j("/trips/"+tr.id).then(function(d){
        var pts=(d.points||[]).map(function(p){return [p.lat,p.lon];});
        if(pts.length<2)return;
        shownTrip=tr.id;
        trail=L.polyline(pts,{color:"#7f77dd",weight:4,opacity:.9}).addTo(map);
        tA=L.circleMarker(pts[0],{radius:6,color:"#1D9E75",fillColor:"#5DCAA5",fillOpacity:1,weight:2}).addTo(map);
        tB=L.circleMarker(pts[pts.length-1],{radius:6,color:"#D85A30",fillColor:"#F0997B",fillOpacity:1,weight:2}).addTo(map);
        map.fitBounds(trail.getBounds(),{padding:[30,30]});
        renderTrips(box,trips);
      });
    };
    box.appendChild(c);
  });
}

/* ============================ desktop: estado a la bandeja ============================ */
function startTrayReport(){
  var last="";
  setInterval(function(){
    var s;
    if(mode!=="sender"){ s="Viewer"; }
    else if(recOn&&linkState==="live"){ s="Recording · linked"; }
    else if(recOn){ s="Recording"; }
    else if(linkState==="live"){ s="Linked · idle"; }
    else if(stream){ s="Camera on"; }
    else { s="Idle"; }
    if(s!==last){ last=s; try{ RD_DESKTOP.setStatus(s); }catch(e){} }
  },2000);
}

// ¿Nos sirve una dashcam? Si /status responde (aunque sea 401) hay API local detrás.
fetch("/status").then(function(r){hasLocal=(r.status===401||r.ok);}).catch(function(){hasLocal=false;})
 .then(function(){
   if(hasLocal&&KEY){
     return fetch("/status",{headers:{Authorization:"Bearer "+KEY}}).then(function(r){if(!r.ok){KEY="";LS.set("rd_key","");}}).catch(function(){});
   }
 }).then(function(){
   if(!mode){
     if(window.RD_DESKTOP)mode="sender";        // app de escritorio: es una camara
     else if(hasLocal)mode="viewer";            // servida por una dashcam: mirarla
   }
   render();
   if(window.RD_DESKTOP)startTrayReport();
 });
